<h1>Industrial Maintenance Platform</h1>

<h2>Machines</h2>

@for (machine of machines(); track machine.id) 
{
  <div>
    <h3>{{ machine.name }}</h3>
    <p>Serial number: {{ machine.serialNumber }}</p>
    <p>Manufacturer: {{ machine.manufacturer }}</p>
    <p>Model: {{ machine.model }}</p>
    <p>Location: {{ machine.location }}</p>
    <p>Status: {{ machine.status }}</p>
  </div>
}
